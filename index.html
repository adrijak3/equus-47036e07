    <script>
      (() => {
        try {
          const saved = localStorage.getItem("equus_theme");
          const map = { blue: "ocean", dark: "midnight", light: "pearl" };
          const theme = map[saved] || (
            saved === "ocean" || saved === "midnight" || saved === "pearl" || saved === "stable"
              ? saved
              : "ocean"
          );
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle("dark", theme !== "pearl");
          document.documentElement.style.colorScheme = theme === "pearl" ? "light" : "dark";
        } catch {}
      })();
    </script>
