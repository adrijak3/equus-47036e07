    <script>
      (() => {
        try {
          const themes = ["spring","summer","autumn","winter","ocean","lavender","midnight","forest","goldleaf","sage"];
          const lightThemes = ["spring","summer","ocean","lavender","sage"];
          const savedTheme = localStorage.getItem("equus_seasonal_theme");
          const savedMode = localStorage.getItem("equus_appearance_mode");
          const month = new Date().getMonth();
          const seasonal = [2,3,4].includes(month)
            ? "spring"
            : [5,6,7].includes(month)
              ? "summer"
              : [8,9,10].includes(month)
                ? "autumn"
                : "winter";
          const theme = savedTheme && themes.includes(savedTheme) && savedTheme !== "automatic"
            ? savedTheme
            : seasonal;
          const mode = savedMode === "light" || savedMode === "dark"
            ? savedMode
            : (lightThemes.includes(theme) ? "light" : "dark");

          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.mode = mode;
          document.documentElement.classList.toggle("dark", mode === "dark");
          document.documentElement.style.colorScheme = mode;
        } catch {}
      })();
    </script>
