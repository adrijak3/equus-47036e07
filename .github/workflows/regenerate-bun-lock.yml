name: Regenerate Bun lockfile

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.head_commit.message != 'Regenerate Bun lockfile'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun 1.2.15
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Regenerate lockfile
        run: bun install --lockfile-only

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "Lockfile already matches package.json."
            exit 0
          fi
          git commit -m "Regenerate Bun lockfile"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/regenerate-bun-lock.yml
          git commit -m "Remove temporary lockfile workflow"
          git push
